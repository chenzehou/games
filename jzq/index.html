<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>井字棋</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
*{margin:0;padding:0;}
body{
    background:#1a1a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
#term{width:480px;}
</style>
</head>
<body>
<div id="term"></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script>
const S=3;
let b=Array.from({length:S},()=>Array(S).fill(0));

function mv(x,y,p){
    if(x<0||x>2||y<0||y>2||b[x][y]!==0){
        return 0;
    }
    b[x][y]=p;
    return 1;
}

function win(){
    let f=true;
    for(let i=0;i<S;i++){
        if(b[i][0]===b[i][1]&&b[i][1]===b[i][2]&&b[i][0]!==0){
            return b[i][0];
        }
        if(b[0][i]===b[1][i]&&b[1][i]===b[2][i]&&b[0][i]!==0){
            return b[0][i];
        }
    }
    if(b[0][0]===b[1][1]&&b[1][1]===b[2][2]&&b[0][0]!==0){
        return b[0][0];
    }
    if(b[0][2]===b[1][1]&&b[1][1]===b[2][0]&&b[0][2]!==0){
        return b[0][2];
    }
    for(let i=0;i<S;i++){
        for(let j=0;j<S;j++){
            if(b[i][j]===0){
                f=false;
            }
        }
    }
    return f?3:0;
}

function pr(){
    let out='\x1B[1m============== 井字棋 ==============\x1B[0m\n';
    for(let i=0;i<S;i++){
        for(let j=0;j<S;j++){
            const val=b[i][j];
            const c=val===0?'-':(val===1?'X':'O');
            if(val===1){
                out+='\x1B[34m  '+c+'  \x1B[0m';
			}else if(val===2){
				out+='\x1B[31m  '+c+'  \x1B[0m';
			}else{
				out+='  '+c+'  ';
			}
			if(j<S-1){
				out+='|';
			}
		}
		if(i<S-1){
			out+='\n-----+-----+-----\n';
		}
	}
	out+='\n';
	return out;
}

let who=1;
let winn=0;
let inputstate=0;
let tempx;

function resetgame(){
	b=Array.from({length:S},()=>Array(S).fill(0));
	who=1;
	winn=0;
	inputstate=0;
	tempx=0;
	render();
}

function render(){
	let output='\x1B[2J\x1B[H';
	output+=pr();
	if(winn!==0){
		if(winn===3){
			output+='\x1B[33m\n平局！\x1B[0m\n';
		}else{
			output+='\x1B[32m\n玩家 '+winn+' 赢了！\x1B[0m\n';
		}
		term.write (output);
		return;
	}
	const playerc=who===1?'\x1B[34mX\x1B[0m':'\x1B[31mO\x1B[0m';
	if(inputstate===0){
		output+='\x1B[36m玩家 '+who+' ('+playerc+'\x1B[36m) 输入 X (1-3):\x1B[0m';
	}else{
		output+='\x1B[36m玩家 '+who+' ('+playerc+'\x1B[36m) 输入 Y (1-3):\x1B[0m';
	}
	term.write(output);
}

function trymove(x,y){
	if(mv(x,y,who)){
		winn=win();
		who=who===1?2:1;
		inputstate=0;
		render();
		if(winn!==0){
			setTimeout(()=>{
				term.write('\r\n\x1B[33m按任意键重新开始...\x1B[0m');
			},100);
		}
	}else{
		term.write('\r\n\x1B[31m位置非空！请重新输入...\x1B[0m\r\n');
		inputstate=0;
		setTimeout(()=>{
			render();
		},300);
	}
}

const term=new Terminal({
	fontSize:18,
	fontFamily:'Consolas,"Courier New",monospace',
	cursorBlink:false,
	cursorStyle:'block',
	convertEol:true,
});
term.open(document.getElementById('term'));
term.focus();

term.onKey(({key,domEvent})=>{
	const ev=domEvent;
	if(winn!==0){
		resetgame();
		return;
	}
	if(key==='\x7f'){
		return;
	}
	if(inputstate===0){
		if(key>='1'&&key<='3'){
			term.write(key);
			tempx=parseInt(key)-1;
			inputstate=1;
			render();
		}
	}else if(inputstate===1){
		if(key>='1'&&key<='3'){
			term.write(key);
			const tempy=parseInt(key)-1;
			trymove(tempx,tempy);
		}
	}
});
term.onData(()=>{});
resetgame();
</script>
</body>
</html>
